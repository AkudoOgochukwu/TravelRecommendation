<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<body>

    <header class="navbar">
        <div class="logo">Travel Boom</div>
        <nav>
            <a href="travel_recommendation.html">Home</a>
            <a href="travel_recommendationabout.html">About Us</a>
            <a href="travel_recommendationcontact.html">Contact Us</a>
        </nav>
    </header>

    <main class="page-content">
        <h1>Contact Us</h1>
        <p>Have a question or ready to plan your next escape? Drop us a line and our team will get back to you within 24 hours.</p>

        <form id="contactForm" class="contact-form">
            <div class="form-group">
                <label for="name">Your Name</label>
                <input type="text" id="name" name="name" placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required>
            </div>

            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" name="message" rows="6" placeholder="Tell us about your dream trip..." required></textarea>
            </div>

            <button type="submit" class="submit-btn">Send Message</button>
        </form>

        <div class="contact-info">
            <p><strong>Email:</strong> O.onyeukwu@miva.edu.ng</p>
            <p><strong>Phone:</strong> +233-53-417-0787</p>
            <p><strong>Address:</strong> Plot 385 New Heaven Avenue, Earth</p>
        </div>
    </main>

</body>
</html>
